<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholar Planner – Daftar Tugas Mahasiswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="tugas">
  <div class="app">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="page-head">
        <h1 class="page-title">Daftar Tugas Mahasiswa</h1>

        <div class="page-actions">
          <label class="search">
            <span aria-hidden="true">🔍</span>
            <input type="search" id="cari" placeholder="Cari Mata Kuliah" aria-label="Cari mata kuliah">
          </label>
          <button type="button" class="btn btn-light" id="btn-tambah">+ Tambah Tugas</button>
        </div>
      </div>

      <div class="layout layout-form">

        <div class="main-col">

          <!-- Filter -->
          <section class="panel">
            <h2 class="panel-title">Filter Tugas</h2>
            <div class="filters">
              <div class="field">
                <label for="filter-status">Filter Status</label>
                <select id="filter-status"></select>
              </div>
              <div class="field">
                <label for="filter-prioritas">Filter Prioritas</label>
                <select id="filter-prioritas"></select>
              </div>
              <div class="field">
                <label for="filter-matkul">Filter Mata Kuliah</label>
                <select id="filter-matkul"></select>
              </div>
            </div>
          </section>

          <!-- Tabel -->
          <section class="panel">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Mata Kuliah</th>
                    <th scope="col">Tgl Diberikan</th>
                    <th scope="col">Deadline</th>
                    <th scope="col">Prioritas</th>
                    <th scope="col">Status</th>
                    <th scope="col">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
          </section>

        </div>

        <!-- Form -->
        <section class="panel">
          <h2 class="panel-title" id="form-title">Tambah Tugas</h2>

          <form class="form" id="form">
            <div class="field">
              <label for="matkul">Mata Kuliah</label>
              <select id="matkul" name="matkul" required></select>
            </div>

            <div class="field">
              <label for="diberikan">Tanggal Diberikan</label>
              <input type="date" id="diberikan" name="diberikan" required>
            </div>

            <div class="field">
              <label for="deadline">Deadline</label>
              <input type="date" id="deadline" name="deadline" required>
            </div>

            <div class="field">
              <label for="prioritas">Prioritas</label>
              <select id="prioritas" name="prioritas"></select>
            </div>

            <div class="field">
              <label for="status">Status</label>
              <select id="status" name="status"></select>
            </div>

            <p class="form-error" id="form-error" role="alert" hidden></p>

            <div class="form-actions">
              <button type="button" class="btn btn-ghost" id="btn-batal">Batal</button>
              <button type="submit" class="btn btn-save">Simpan</button>
            </div>
          </form>
        </section>

      </div>
    </main>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/tugas.js"></script>
</body>
</html>
