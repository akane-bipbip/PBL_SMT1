<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholar Planner – Data Mata Kuliah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="mata-kuliah">
  <div class="app">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="page-head">
        <h1 class="page-title">Data Mata Kuliah</h1>
        <button type="button" class="btn btn-light" id="btn-tambah">+ Tambah Mata Kuliah</button>
      </div>

      <div class="layout layout-form">

        <!-- Tabel -->
        <section class="panel">
          <h2 class="panel-title">Daftar Mata Kuliah</h2>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Kode</th>
                  <th scope="col">Nama Mata Kuliah</th>
                  <th scope="col">SKS</th>
                  <th scope="col">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>

        <!-- Form -->
        <section class="panel">
          <h2 class="panel-title" id="form-title">Tambah Mata Kuliah</h2>

          <form class="form" id="form">
            <div class="field">
              <label for="kode">Kode Mata Kuliah</label>
              <input type="text" id="kode" name="kode" placeholder="Contoh : IF106" maxlength="10" required>
            </div>

            <div class="field">
              <label for="nama">Nama Mata Kuliah</label>
              <input type="text" id="nama" name="nama" placeholder="Contoh : Matematika" required>
            </div>

            <div class="field">
              <label for="sks">Jumlah SKS</label>
              <input type="number" id="sks" name="sks" value="3" min="1" max="6" required>
            </div>

            <p class="form-error" id="form-error" role="alert" hidden></p>

            <div class="form-actions">
              <button type="button" class="btn btn-ghost" id="btn-batal">Batal</button>
              <button type="submit" class="btn btn-save">Simpan</button>
            </div>
          </form>
        </section>

      </div>
    </main>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/mata-kuliah.js"></script>
</body>
</html>
