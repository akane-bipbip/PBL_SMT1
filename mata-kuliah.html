<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mata Kuliah - Scholar Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-content">
        <h1 class="page-title">Data Mata Kuliah</h1>

        <div class="page-layout">
            <div class="card-panel">
                <h3>Daftar Mata Kuliah</h3><br>
                <table>
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Nama Mata Kuliah</th>
                            <th>SKS</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tb-matkul"></tbody>
                </table>
            </div>

            <div class="card-panel">
                <h3 id="form-title-matkul">Tambah Mata Kuliah</h3><br>
                <form id="form-matkul">
                    <input type="hidden" id="edit-index-matkul" value="">
                    <div class="form-group">
                        <label>Kode Mata Kuliah</label>
                        <input type="text" id="kode" class="form-control" placeholder="Contoh: IF104" required>
                    </div>
                    <div class="form-group">
                        <label>Nama Mata Kuliah</label>
                        <input type="text" id="nama" class="form-control" placeholder="Contoh: Pemrograman Web" required>
                    </div>
                    <div class="form-group">
                        <label>Jumlah SKS</label>
                        <input type="number" id="sks" class="form-control" min="1" max="6" value="3" required>
                    </div>
                    <div class="btn-group">
                        <button type="button" id="btn-cancel-matkul" class="btn btn-secondary" style="display:none;" onclick="resetFormMatkul()">Batal</button>
                        <button type="submit" class="btn btn-primary" id="btn-submit-matkul">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="storage.js"></script>
    <script src="layout.js"></script>
    <script>
        function renderMatkul() {
            const list = Storage.getMataKuliah();
            const tbody = document.getElementById('tb-matkul');
            tbody.innerHTML = list.map((item, index) => `
                <tr>
                    <td>${item.kode}</td>
                    <td>${item.nama}</td>
                    <td>${item.sks} SKS</td>
                    <td>
                        <span class="action-link" onclick="editMatkul(${index})">Edit</span> | 
                        <span class="action-link delete" onclick="deleteMatkul(${index})">Hapus</span>
                    </td>
                </tr>
            `).join('');
        }

        function editMatkul(index) {
            const list = Storage.getMataKuliah();
            const item = list[index];
            document.getElementById('edit-index-matkul').value = index;
            document.getElementById('kode').value = item.kode;
            document.getElementById('nama').value = item.nama;
            document.getElementById('sks').value = item.sks;
            document.getElementById('form-title-matkul').innerText = 'Edit Mata Kuliah';
            document.getElementById('btn-submit-matkul').innerText = 'Update';
            document.getElementById('btn-cancel-matkul').style.display = 'inline-block';
        }

        function resetFormMatkul() {
            document.getElementById('form-matkul').reset();
            document.getElementById('edit-index-matkul').value = '';
            document.getElementById('form-title-matkul').innerText = 'Tambah Mata Kuliah';
            document.getElementById('btn-submit-matkul').innerText = 'Simpan';
            document.getElementById('btn-cancel-matkul').style.display = 'none';
        }

        function deleteMatkul(index) {
            if (confirm('Yakin ingin menghapus mata kuliah ini?')) {
                const list = Storage.getMataKuliah();
                list.splice(index, 1);
                Storage.setMataKuliah(list);
                renderMatkul();
                resetFormMatkul();
            }
        }

        document.getElementById('form-matkul').addEventListener('submit', (e) => {
            e.preventDefault();
            const list = Storage.getMataKuliah();
            const editIndex = document.getElementById('edit-index-matkul').value;
            
            const newItem = {
                kode: document.getElementById('kode').value,
                nama: document.getElementById('nama').value,
                sks: parseInt(document.getElementById('sks').value)
            };

            if (editIndex === '') {
                list.push(newItem);
            } else {
                list[editIndex] = newItem;
            }

            Storage.setMataKuliah(list);
            renderMatkul();
            resetFormMatkul();
        });

        renderMatkul();
    </script>
</body>
</html>
