<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholar Planner – Jadwal Belajar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="jadwal">
  <div class="app">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="page-head">
        <h1 class="page-title">Jadwal Belajar</h1>
        <button type="button" class="btn btn-light" id="btn-tambah">+ Tambah Jadwal</button>
      </div>

      <div class="layout layout-form">

        <section class="panel">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Mata Kuliah</th>
                  <th scope="col">Kode</th>
                  <th scope="col">Dosen</th>
                  <th scope="col">Hari</th>
                  <th scope="col">Waktu</th>
                  <th scope="col">Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>

        <!-- Form -->
        <section class="panel">
          <h2 class="panel-title" id="form-title">Tambah Jadwal</h2>

          <form class="form" id="form">
            <div class="field">
              <label for="matkul">Mata Kuliah</label>
              <select id="matkul" name="matkul" required></select>
            </div>

            <div class="field">
              <label for="kode">Kode</label>
              <input type="text" id="kode" name="kode" readonly>
            </div>

            <div class="field">
              <label for="dosen">Dosen</label>
              <input type="text" id="dosen" name="dosen" placeholder="Contoh : Dr. Andi" required>
            </div>

            <div class="field">
              <label for="hari">Hari</label>
              <select id="hari" name="hari"></select>
            </div>

            <div class="field">
              <label for="waktu">Waktu</label>
              <input type="text" id="waktu" name="waktu" placeholder="Contoh : 08.00-10.00"
                     pattern="\d{2}[.:]\d{2}-\d{2}[.:]\d{2}" title="Format: 08.00-10.00" required>
            </div>

            <p class="form-error" id="form-error" role="alert" hidden></p>

            <div class="form-actions">
              <button type="button" class="btn btn-ghost" id="btn-batal">Batal</button>
              <button type="submit" class="btn btn-save">Simpan</button>
            </div>
          </form>
        </section>

      </div>
    </main>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/jadwal.js"></script>
</body>
</html>
