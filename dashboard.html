<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholar Planner – Dashboard Mahasiswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
  <div class="app">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <h1 class="page-title">Dashboard Mahasiswa</h1>

      <!-- Ringkasan -->
      <section class="stats" aria-label="Ringkasan">
        <div class="stat-card">
          <p class="stat-label">Tugas Belum Selesai</p>
          <p class="stat-value" id="stat-belum">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Mendekati Deadline</p>
          <p class="stat-value" id="stat-deadline">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Jadwal Hari Ini</p>
          <p class="stat-value" id="stat-jadwal">0</p>
        </div>
      </section>

      <!-- Tugas dekat deadline -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Tugas Dekat Deadline</h2>
          <a href="tugas.html" class="panel-link">Lihat Semua →</a>
        </div>
        <ul class="list" id="list-deadline"></ul>
      </section>

      <!-- Jadwal hari ini -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Jadwal Tugas Hari Ini</h2>
          <a href="jadwal.html" class="panel-link">Atur Jadwal →</a>
        </div>
        <ul class="list" id="list-jadwal"></ul>
      </section>
    </main>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
